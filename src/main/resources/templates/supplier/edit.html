<!DOCTYPE html>
<html lang="en">
<head th:replace="~{layout/head::head ('Chỉnh sửa NCC')}">
</head>
<body class="hold-transition sidebar-mini layout-fixed text-sm">
<div class="wrapper">
    <th:block th:insert="~{layout/sidebar::sidebar}"></th:block>
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="page-title m-0">Sửa</h1>
                    </div><!-- /.col -->
                </div><!-- /.row -->
            </div><!-- /.container-fluid -->
        </div>

        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card card-default">
                            <div class="card-body">
                                <div class="mt-2">
                                    <div class="mt-4">
                                        <div class="container">

                                            <form th:action="@{/supplier/edit/{id}(id=${supplier.id})}" th:object="${supplier}"
                                                  method="post">
                                                <div class="mb-3">
                                                    <label for="code" class="form-label">Mã NCC: </label>
                                                    <input type="text" class="form-control" id="code"
                                                           th:field="*{code}" maxlength="50" readonly/>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="name" class="form-label">Tên NCC: </label>
                                                    <input type="text" class="form-control" id="name" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                                           th:field="*{name}" required/>
                                                    <!--                                                    <p style="color: red" th:errors="*{name}"></p>-->
                                                    <span class="invalid-feedback" role="alert">
                                                        <strong th:if="${#fields.hasErrors('name')}" th:text="${#fields.errors('name')[0]}"></strong>
                                                    </span>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="email" class="form-label">Email: </label>
                                                    <input type="text" class="form-control" id="email" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                                           th:field="*{email}" required/>
                                                    <!--                                                    <p style="color: red" th:errors="*{email}"></p>-->
                                                    <span class="invalid-feedback" role="alert">
                                                        <strong th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></strong>
                                                    </span>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="address" class="form-label">Địa chỉ: </label>
                                                    <input type="text" class="form-control" id="address" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                                                           name="description" th:field="*{address}" required/>
                                                    <!--                                                    <p style="color: red" th:errors="*{address}"></p>-->
                                                    <span class="invalid-feedback" role="alert">
                                                        <strong th:if="${#fields.hasErrors('address')}" th:text="${#fields.errors('address')[0]}"></strong>
                                                    </span>
                                                </div>

                                                <div class="mb-3">
                                                    <label for="phone" class="form-label">SĐT: </label>
                                                    <input type="text" class="form-control" id="phone" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                                           name="description" th:field="*{phone}"/>
                                                    <!--                                                    <p style="color: red" th:errors="*{phone}"></p>-->
                                                    <span class="invalid-feedback" role="alert">
                                                        <strong th:if="${#fields.hasErrors('phone')}" th:text="${#fields.errors('phone')[0]}"></strong>
                                                    </span>
                                                </div>

                                                <div class="mb-3">
                                                    <label for="note" class="form-label">Mô tả: </label>
                                                    <input type="text" class="form-control" id="note" th:classappend="${#fields.hasErrors('note')} ? 'is-invalid' : ''"
                                                           name="description" th:field="*{note}"/>
                                                    <!--                                                    <p style="color: red" th:errors="*{note}"></p>-->
                                                    <span class="invalid-feedback" role="alert">
                                                        <strong th:if="${#fields.hasErrors('note')}" th:text="${#fields.errors('note')[0]}"></strong>
                                                    </span>
                                                </div>
                                                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<div class="modal fade" id="successModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Thông báo</h4>
            </div>
            <div class="modal-body">
                <p th:text="${message}"></p> <!-- Dùng biến `message` từ controller -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal" onclick="window.location.href='/supplier/list'">Đóng</button>
            </div>
        </div>
    </div>
</div>

</body>

<th:block th:replace="~{layout/script::script}">
</th:block>
<script>
    $(document).ready(function () {
        // Kiểm tra nếu biến message có giá trị thì hiển thị modal
        let message = $("#successModal .modal-body p").text().trim();
        if (message.length > 0) {
            $("#successModal").modal("show");
        }
    });
</script>
</html>
